# Suite configuration
# Assumes your local dev server is at 127.0.0.1:9999:
#
#   symfony server:start --port 9999
#

namespace: Tests
support_namespace: Support
paths:
    tests: tests
    output: tests/_output
    data: tests/Support/Data
    support: tests/Support
    envs: tests/_envs
actor_suffix: Tester
extensions:
    enabled:
        - Codeception\Extension\RunFailed
        - Codeception\Extension\Logger
params:
    # Both files are loaded into $_ENV for the tests, the last one wins (as with
    # Symfony): .env.test.local overrides .env.test with the platform credentials
    # and, against production, the real client id and secret
    - .env.test
    - .env.test.local