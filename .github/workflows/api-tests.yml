name: API tests

# Runs the Codeception Api suite against the production API every day, to be
# alerted when a music platform changes its API (plus the Unit suite).
on:
  schedule:
    - cron: '0 7 * * *' # every day at 07:00 UTC
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write # needed by the keepalive step to re-enable the schedule

    steps:
      - uses: actions/checkout@v7

      # composer.lock requires PHP >= 8.4. Newer runner images ship it; older ones
      # get it from the Ubuntu PHP PPA (no third-party action involved).
      - name: Ensure PHP >= 8.4
        run: |
          if php -r 'exit(version_compare(PHP_VERSION, "8.4.0", ">=") ? 0 : 1);'; then
            echo "Using the runner's PHP $(php -r 'echo PHP_VERSION;')"
          else
            sudo add-apt-repository -y ppa:ondrej/php
            sudo apt-get update -q
            sudo apt-get install -y -q php8.4-cli php8.4-curl php8.4-mbstring php8.4-xml php8.4-intl php8.4-mysql
            sudo update-alternatives --set php /usr/bin/php8.4
          fi
          php -v && composer --version

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Write the test credentials
        run: |
          cat > .env.test.local <<EOT
          LOG_ENABLED=0
          TEST_API_CLIENT_ID=${{ secrets.TEST_API_CLIENT_ID }}
          TEST_API_CLIENT_SECRET=${{ secrets.TEST_API_CLIENT_SECRET }}
          EOT

      - name: Unit tests
        run: vendor/bin/codecept run Unit

      - name: API tests (production)
        id: api
        continue-on-error: true
        run: vendor/bin/codecept run Api --env production --steps

      # The music platforms are sometimes slow to answer: retry once before failing
      - name: API tests (production, retry)
        if: steps.api.outcome == 'failure'
        run: vendor/bin/codecept run Api --env production --steps

      - name: Keep the scheduled workflow alive
        # GitHub disables scheduled workflows after 60 days without commits;
        # re-enabling the workflow through the API resets that counter
        if: github.event_name == 'schedule'
        run: gh workflow enable api-tests.yml
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: codeception-output
          path: tests/_output
          if-no-files-found: ignore
