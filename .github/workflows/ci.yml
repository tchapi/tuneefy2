name: CI

# Runs on every push, without any secret, as two parallel jobs:
#  - static: lints, code style, static analysis and the Unit suite
#  - app:    the database built from the migrations, the commands that cron runs
#            on the server, the Acceptance suite and the Api tests that need no
#            music platform credentials (group "offline")
# The full Api suite is run daily against production by api-tests.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # composer.lock requires PHP >= 8.4. Newer runner images ship it; older ones
      # get it from the Ubuntu PHP PPA (no third-party action involved).
      - name: Ensure PHP >= 8.4
        run: |
          if php -r 'exit(version_compare(PHP_VERSION, "8.4.0", ">=") ? 0 : 1);'; then
            echo "Using the runner's PHP $(php -r 'echo PHP_VERSION;')"
          else
            sudo add-apt-repository -y ppa:ondrej/php
            sudo apt-get update -q
            sudo apt-get install -y -q php8.4-cli php8.4-curl php8.4-mbstring php8.4-xml php8.4-intl php8.4-mysql
            sudo update-alternatives --set php /usr/bin/php8.4
          fi
          php -v && composer --version

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      # codeception.yml loads this file as a params source: it must exist, even empty
      - name: Create an empty .env.test.local
        run: touch .env.test.local

      - name: Lint the container, templates and config
        run: |
          php bin/console lint:container --env=test
          php bin/console lint:twig templates
          php bin/console lint:yaml config

      - name: Code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.php

      - name: Static analysis
        run: vendor/bin/psalm --no-progress --threads=4

      - name: Unit tests
        run: vendor/bin/codecept run Unit

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    services:
      mariadb:
        # Same major version as DATABASE_URL's serverVersion in .env
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: tuneefy_test # the test env appends _test to the name in DATABASE_URL
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Ensure PHP >= 8.4
        run: |
          if php -r 'exit(version_compare(PHP_VERSION, "8.4.0", ">=") ? 0 : 1);'; then
            echo "Using the runner's PHP $(php -r 'echo PHP_VERSION;')"
          else
            sudo add-apt-repository -y ppa:ondrej/php
            sudo apt-get update -q
            sudo apt-get install -y -q php8.4-cli php8.4-curl php8.4-mbstring php8.4-xml php8.4-intl php8.4-mysql
            sudo update-alternatives --set php /usr/bin/php8.4
          fi
          php -v && composer --version

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Point the test env at the database service
        run: |
          cat > .env.test.local <<EOT
          DATABASE_URL="mysql://root:root@127.0.0.1:3306/tuneefy?serverVersion=10.11.2-MariaDB&charset=utf8mb4"
          EOT

      - name: Run the migrations on an empty database
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Check the entity mapping against the migrated schema
        run: php bin/console doctrine:schema:validate --env=test

      - name: Run the cron commands
        run: |
          php bin/console tuneefy:update-stats --env=test
          php bin/console tuneefy:clean-expired-intents --env=test
          php bin/console league:oauth2-server:clear-expired-tokens --env=test

      # Same setup as the README's "Acceptance and Api tests, locally" section
      - name: Start the test server
        run: |
          php bin/console league:oauth2-server:generate-keypair --env=test
          php bin/console league:oauth2-server:create-client --env=test "Test client" test_id test_secret --grant-type client_credentials --scope api
          APP_ENV=test php -d variables_order=EGPCS -S 127.0.0.1:9999 -t public > /tmp/server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://localhost:9999/ && break; sleep 0.5; done
          curl -sf -o /dev/null http://localhost:9999/

      - name: Acceptance tests
        run: vendor/bin/codecept run Acceptance

      - name: Api tests needing no platform credentials
        run: vendor/bin/codecept run Api -g offline

      - name: Server log
        if: failure()
        run: cat /tmp/server.log

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: codeception-output
          path: tests/_output
          if-no-files-found: ignore
